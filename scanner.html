<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>📷 Universal Barcode Scanner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-900 text-white min-h-screen flex flex-col justify-center items-center p-4">

  <!-- Header -->
  <header class="text-center mb-4">
    <h1 class="text-3xl font-bold text-lime-400">📷 Universal Barcode Scanner</h1>
    <p class="text-sm text-gray-400 mt-1">Supports QR, PDF417, UPC, Code128, and more</p>
  </header>

  <!-- Video Feed -->
  <div class="w-full max-w-md aspect-video bg-black rounded-xl border border-lime-500 overflow-hidden">
    <video id="video" class="w-full h-full" autoplay muted playsinline></video>
  </div>

  <!-- Scan Result -->
  <div id="output" class="mt-4 text-center text-lime-300 text-sm font-mono break-all">
    Awaiting scan...
  </div>

  <!-- Buttons -->
  <div class="mt-4 flex gap-4">
    <button id="startBtn"
      class="px-5 py-2 bg-lime-500 text-black font-bold rounded-lg hover:bg-lime-400 transition">
      ▶️ Start Scanner
    </button>
    <button id="stopBtn"
      class="px-5 py-2 bg-red-500 text-white font-bold rounded-lg hover:bg-red-400 transition hidden">
      ⏹ Stop
    </button>
  </div>

  <!-- ZXing Script -->
  <script type="module">
    import {
      BrowserMultiFormatReader,
      BarcodeFormat,
      DecodeHintType,
      NotFoundException
    } from 'https://cdn.jsdelivr.net/npm/@zxing/library@0.19.1/+esm';

    const video = document.getElementById('video');
    const output = document.getElementById('output');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');

    const hints = new Map();
    hints.set(DecodeHintType.POSSIBLE_FORMATS, [
      BarcodeFormat.QR_CODE,
      BarcodeFormat.PDF_417,
      BarcodeFormat.DATA_MATRIX,
      BarcodeFormat.AZTEC,
      BarcodeFormat.CODE_128,
      BarcodeFormat.CODE_39,
      BarcodeFormat.EAN_13,
      BarcodeFormat.EAN_8,
      BarcodeFormat.UPC_A,
      BarcodeFormat.UPC_E,
      BarcodeFormat.ITF,
    ]);

    const codeReader = new BrowserMultiFormatReader(hints);

    let scanning = false;

    startBtn.onclick = async () => {
      output.textContent = "🔍 Scanning...";
      startBtn.classList.add("hidden");
      stopBtn.classList.remove("hidden");
      scanning = true;

      const devices = await codeReader.listVideoInputDevices();
      const deviceId = devices?.[0]?.deviceId;

      if (!deviceId) {
        output.textContent = "❌ No camera found.";
        return;
      }

      codeReader.decodeFromVideoDevice(deviceId, video, (result, err) => {
        if (result) {
          output.textContent = `✅ Detected: ${result.getText()}`;
          navigator.vibrate?.(200);
          codeReader.reset();
          scanning = false;
          startBtn.classList.remove("hidden");
          stopBtn.classList.add("hidden");
        } else if (err && !(err instanceof NotFoundException)) {
          output.textContent = `⚠️ Error: ${err}`;
        }
      });
    };

    stopBtn.onclick = () => {
      codeReader.reset();
      scanning = false;
      output.textContent = "⏹ Scanner stopped.";
      startBtn.classList.remove("hidden");
      stopBtn.classList.add("hidden");
    };
  </script>

</body>
</html>
